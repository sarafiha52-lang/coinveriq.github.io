<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VERIQ | Digital Business & Media Verification Ecosystem</title>

    <meta name="description" content="VERIQ (VRQ) is an Ethereum-based project focused on digital business verification, AI media authenticity analysis and cryptographic verification services.">

    <meta name="theme-color" content="#060913">

    <link rel="icon" type="image/svg+xml" href="veriq.svg">
    <link rel="canonical" href="https://sarafiha52-lang.github.io/coinveriq.github.io/">

    <style>
        :root {
            --background: #060913;
            --surface: #0b1324;
            --card: #0f1b30;
            --blue: #38bdf8;
            --cyan: #22d3ee;
            --text: #ffffff;
            --muted: #9ca3af;
            --border: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 84%;
            max-width: 1200px;
            margin: auto;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(6, 9, 19, 0.96);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 27px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            transition: .3s;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        .nav-button {
            padding: 9px 17px;
            border: 1px solid var(--blue);
            border-radius: 6px;
            color: var(--blue) !important;
        }

        /* HERO */

        .hero {
            padding: 120px 20px;
            text-align: center;
            background:
                radial-gradient(ellipse at top, #102c50 0%, #0b1324 45%, #060913 85%);
        }

        .hero-label {
            display: inline-block;
            padding: 7px 17px;
            border: 1px solid #164e63;
            border-radius: 30px;
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .hero h1 {
            max-width: 900px;
            margin: auto;
            font-size: clamp(36px, 5vw, 62px);
            line-height: 1.15;
            font-weight: 800;
        }

        .gradient-text {
            background: linear-gradient(90deg, #38bdf8, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            max-width: 760px;
            margin: 25px auto 35px;
            color: var(--muted);
            font-size: 17px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            transition: .3s;
        }

        .btn-primary {
            background: var(--blue);
            color: #06101d;
        }

        .btn-primary:hover {
            background: var(--cyan);
            transform: translateY(-2px);
        }

        .btn-outline {
            color: var(--blue);
            border: 1px solid var(--blue);
        }

        .btn-outline:hover {
            background: rgba(56, 189, 248, .1);
        }

        /* GENERAL SECTIONS */

        section {
            padding: 90px 0;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-heading h2 {
            font-size: clamp(28px, 4vw, 38px);
            margin-bottom: 12px;
        }

        .section-heading p {
            color: var(--muted);
            max-width: 720px;
            margin: auto;
            font-size: 15px;
        }

        /* CONTRACT */

        .contract-section {
            background: #080e1b;
        }

        .contract-box {
            max-width: 850px;
            margin: auto;
            padding: 35px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
        }

        .contract-label {
            color: var(--blue);
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .contract-address {
            display: block;
            padding: 16px;
            text-align: center;
            background: #060913;
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--cyan);
            font-family: monospace;
            font-size: 14px;
            overflow-wrap: anywhere;
            margin-bottom: 25px;
        }

        .contract-actions {
            text-align: center;
            margin-bottom: 25px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table td {
            padding: 13px 8px;
            border-bottom: 1px solid var(--border);
        }

        .info-table td:first-child {
            color: var(--muted);
        }

        .info-table td:last-child {
            color: white;
            font-weight: 600;
            text-align: right;
        }

        /* UTILITY */

        .utility-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .utility-card {
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: .3s;
        }

        .utility-card:hover {
            border-color: var(--blue);
            transform: translateY(-4px);
        }

        .card-number {
            color: var(--blue);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .utility-card h3 {
            margin: 15px 0;
            font-size: 21px;
        }

        .utility-card p {
            color: var(--muted);
            font-size: 14px;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 5px 12px;
            border: 1px solid #475569;
            border-radius: 20px;
            color: var(--cyan);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* TECHNOLOGY */

        .technology-section {
            background: #080e1b;
        }

        .technology-box {
            max-width: 900px;
            margin: auto;
            padding: 35px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .technology-box h3 {
            color: var(--blue);
            margin-bottom: 15px;
            font-size: 22px;
        }

        .technology-box p {
