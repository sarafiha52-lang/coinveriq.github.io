<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veriq Ecosystem - Official Project & Token Portal</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" sizes="32x32">
    <!-- Ethers.js for Web3 Integration -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        /* Smooth Scrolling Enabled globally */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #060913;
            color: #ffffff;
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #0b0f19;
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1.5px;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 25px;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        section {
            padding: 100px 8%;
            display: block;
            clear: both;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #ffffff;
        }

        .section-title span {
            color: #38bdf8;
        }

        .section-subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 140px 8% 120px 8%;
            background: #0b132b;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            font-size: 19px;
            color: #9ca3af;
            max-width: 750px;
            margin: 0 auto 35px auto;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            background-color: #38bdf8;
            color: #060913;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: #0ea5e9;
        }

        .btn-secondary {
            background-color: transparent;
            color: #38bdf8;
            border: 2px solid #38bdf8;
        }

        .btn-secondary:hover {
            background-color: rgba(56, 189, 248, 0.1);
            color: #ffffff;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
        }

        .contract-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 750px;
            margin: 0 auto;
            text-align: center;
        }

        .contract-label {
            font-size: 13px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .contract-string {
            font-family: monospace;
            color: #38bdf8;
            font-size: 16px;
            word-break: break-all;
            background: #060913;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            display: block;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .spec-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            text-align: left;
        }

        .spec-table th, .spec-table td {
            padding: 12px;
            border-bottom: 1px solid #1f2937;
        }

        .spec-table th {
            color: #9ca3af;
        }

        .spec-table td {
            color: #ffffff;
            font-weight: 600;
        }

        .utility-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .utility-card {
            background-color: #0f172a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            flex: 1;
            min-width: 250px;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .utility-card h3 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .utility-card p {
            color: #9ca3af;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .web3-input {
            width: 100%;
            padding: 10px;
            background: #060913;
            border: 1px solid #1f2937;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .status-msg {
            font-size: 12px;
            color: #e2e8f0;
            margin-top: 10px;
            font-style: italic;
            text-align: center;
        }

        /* Utility Code Viewer Styling */
        .code-viewer-container {
            max-width: 750px;
            margin: 0 auto;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 25px;
        }

        .code-viewer-header {
            color: #38bdf8;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-block {
            background: #060913;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
        }

        .code-block code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #38bdf8;
            white-space: pre;
        }

        .roadmap-timeline {
            max-width: 700px;
            margin: 0 auto;
        }

        .roadmap-content {
            padding: 20px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        .roadmap-content h3 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .roadmap-content p {
            color: #9ca3af;
            font-size: 14px;
        }

        .team-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .team-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .team-card h3 {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .team-card .role {
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .team-card p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
        }

        footer {
            background-color: #0b0f19;
            padding: 40px 8%;
            border-top: 1px solid #1f2937;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .social-icon {
            color: #ffffff;
            background: #1f2937;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }

        .social-icon:hover {
            background: #38bdf8;
            color: #060913;
        }

        footer p {
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .nav-container { flex-direction: column; gap: 10px; }
            .nav-links { display: none; }
            .utility-grid, .team-grid { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <header>
